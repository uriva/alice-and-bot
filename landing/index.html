<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Alice&Bot - WhatsApp for AI Agents</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta
      name="description"
      content="Alice&Bot is like WhatsApp for agents. The easiest way to chat with many AI agents in one place — without paying anyone and without giving anyone access to your data."
    />
    <meta property="og:image" content="https://aliceandbot.com/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="theme-color"
      content="#f6f4ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c0c0b"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Alice&Bot" />
    <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    body {
      font-family:
        "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button:not(:disabled),
    [role="button"]:not(:disabled) {
      cursor: pointer;
    }
    </style>
  </head>
  <body
    class="bg-[#f6f4ee] dark:bg-[#0c0c0b]"
    style="min-height: var(--app-height, 100dvh)"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
