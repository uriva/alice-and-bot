name: Push InstantDB Permissions

on:
  push:
    branches:
      - main
    paths:
      - "instant.perms.ts"
      - "instant.schema.ts"
      - ".github/workflows/push-perms.yml"
  workflow_dispatch:

jobs:
  push-perms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Push InstantDB permissions
        env:
          INSTANT_ADMIN_TOKEN: ${{ secrets.INSTANT_ADMIN_TOKEN }}
          INSTANT_CLI_AUTH_TOKEN: ${{ secrets.INSTANT_ADMIN_TOKEN }}
        run: npx --yes instant-cli@latest push perms --app 8f3bebac-da7b-44ab-9cf5-46a6cc11557e --token "${INSTANT_ADMIN_TOKEN}" --yes
