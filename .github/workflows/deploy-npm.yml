name: Publish npm

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish-npm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm versions
        id: check
        run: |
          VERSION=$(jq -r .version deno.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "alice-and-bot@${VERSION}" version >/dev/null 2>&1; then
            echo "alice-and-bot@${VERSION} already published"
            echo "should_publish_sdk=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_sdk=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "alice-and-bot-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "alice-and-bot-mcp@${VERSION} already published"
            echo "should_publish_mcp=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_mcp=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build npm packages
        if: steps.check.outputs.should_publish_sdk == 'true' || steps.check.outputs.should_publish_mcp == 'true'
        run: deno run -A scripts/buildNpm.ts

      - name: Smoke test built packages in Node.js
        if: steps.check.outputs.should_publish_sdk == 'true' || steps.check.outputs.should_publish_mcp == 'true'
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' \
            | ALICEANDBOT_MCP_CONFIG_DIR=/tmp/mcp-ci-smoke node dist/npm/alice-and-bot-mcp/bin/alice-and-bot-mcp.js \
            | grep -q "aliceandbot_setup"

      - name: Publish alice-and-bot to npm (OIDC Trusted Publishing)
        if: steps.check.outputs.should_publish_sdk == 'true'
        working-directory: dist/npm/alice-and-bot
        run: npm publish --access public

      - name: Publish alice-and-bot-mcp to npm (OIDC Trusted Publishing)
        if: steps.check.outputs.should_publish_mcp == 'true'
        working-directory: dist/npm/alice-and-bot-mcp
        run: npm publish --access public
