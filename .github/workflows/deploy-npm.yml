name: Publish npm

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish-npm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm and MCP Registry versions
        id: check
        run: |
          VERSION=$(jq -r .version deno.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "alice-and-bot@${VERSION}" version >/dev/null 2>&1; then
            echo "alice-and-bot@${VERSION} already published"
            echo "should_publish_sdk=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_sdk=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "alice-and-bot-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "alice-and-bot-mcp@${VERSION} already published"
            echo "should_publish_mcp=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_mcp=true" >> "$GITHUB_OUTPUT"
          fi
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.uriva%2Falice-and-bot/versions/${VERSION}" >/dev/null 2>&1; then
            echo "MCP Registry io.github.uriva/alice-and-bot@${VERSION} already published"
            echo "should_publish_registry=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_registry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build npm packages
        if: steps.check.outputs.should_publish_sdk == 'true' || steps.check.outputs.should_publish_mcp == 'true' || steps.check.outputs.should_publish_registry == 'true'
        run: deno run -A scripts/buildNpm.ts

      - name: Smoke test built packages in Node.js
        if: steps.check.outputs.should_publish_sdk == 'true' || steps.check.outputs.should_publish_mcp == 'true'
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' \
            | ALICEANDBOT_MCP_CONFIG_DIR=/tmp/mcp-ci-smoke node dist/npm/alice-and-bot-mcp/bin/alice-and-bot-mcp.js \
            | grep -q "aliceandbot_setup"

      - name: Publish alice-and-bot to npm (OIDC Trusted Publishing)
        if: steps.check.outputs.should_publish_sdk == 'true'
        working-directory: dist/npm/alice-and-bot
        run: npm publish --access public

      - name: Publish alice-and-bot-mcp to npm (OIDC Trusted Publishing)
        if: steps.check.outputs.should_publish_mcp == 'true'
        working-directory: dist/npm/alice-and-bot-mcp
        run: npm publish --access public

      - name: Wait for alice-and-bot-mcp on npm registry
        if: steps.check.outputs.should_publish_registry == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://registry.npmjs.org/alice-and-bot-mcp/${VERSION}" >/dev/null 2>&1; then
              echo "alice-and-bot-mcp@${VERSION} is live on registry.npmjs.org"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for npm version ${VERSION}; attempting MCP Registry publish anyway."

      - name: Publish to Official MCP Registry (GitHub OIDC)
        if: steps.check.outputs.should_publish_registry == 'true'
        working-directory: dist/npm/alice-and-bot-mcp
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "MCP Registry publish attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1
