name: Deploy Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/alice-and-bot/webrtc-bridge:latest bridge/
          docker push gcr.io/alice-and-bot/webrtc-bridge:latest

      - name: Restart bridge on VM
        run: |
          gcloud compute ssh webrtc-bridge \
            --zone=us-central1-a \
            --project=alice-and-bot \
            --command="docker-credential-gcr configure-docker --registries=gcr.io && docker pull gcr.io/alice-and-bot/webrtc-bridge:latest && docker stop bridge || true && docker rm bridge || true && docker run -d --name bridge --network host --restart always gcr.io/alice-and-bot/webrtc-bridge:latest"

      - name: Sync Caddyfile
        run: |
          cat bridge/Caddyfile | gcloud compute ssh webrtc-bridge \
            --zone=us-central1-a \
            --project=alice-and-bot \
            --command="cat > /tmp/twilio.Caddyfile"

      - name: Restart caddy TLS front
        run: |
          gcloud compute ssh webrtc-bridge \
            --zone=us-central1-a \
            --project=alice-and-bot \
            --command="sudo docker pull caddy:2 && sudo docker stop caddy || true && sudo docker rm caddy || true && sudo docker run -d --name caddy --network host --restart always -v caddy_data:/data -v caddy_config:/config -v /tmp/twilio.Caddyfile:/etc/caddy/Caddyfile:ro caddy:2 caddy run --config /etc/caddy/Caddyfile"
